    :root {
      --bg: #15101f;
      --text: #ede9f4;
      --muted: #a9a1be;
      --violet: #9b8ac4;
      --green: #4fd88a;
      --code: clamp(8.5rem, 38vw, 14rem);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      line-height: 1.4;
      overflow-x: hidden;
    }

    main { width: 100%; max-width: 48rem; }

    h1 {
      margin: 0;
      font-size: var(--code);
      font-weight: 900;
      line-height: .85;
      letter-spacing: -.09em;
      margin-right: -.09em;             /* compense l'espacement négatif pour rester centré */
      color: var(--bg);
      text-shadow: -1px -1px 0 var(--violet), 1px 1px 0 var(--green);
    }

    h2 {
      position: relative;
      margin: calc(var(--code) * -.2) 0 0;
      font-size: clamp(1.15rem, 4.6vw, 2.6rem);
      font-weight: 700;
      letter-spacing: .3em;
      margin-right: -.3em;
      text-transform: uppercase;
      text-shadow: 0 2px 0 var(--violet);
      text-wrap: balance;
    }

    p {
      margin: 1.5rem auto 0;
      max-width: 38ch;
      color: var(--muted);
      font-size: .95rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .9rem;
      margin-top: 2.25rem;
    }

    .actions a {
      display: inline-block;
      padding: .7rem 2.4rem;
      border: 2px solid currentColor;
      color: var(--green);
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color .2s;
    }
    .actions a:hover { color: var(--violet); }
    .actions a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .actions a { transition: none; }
    }
  </style>
</head>

    <h2>Page introuvable</h2>
    <p>Cette adresse n’existe pas sur 2forge.me. Elle a peut-être été déplacée ou mal saisie.</p>
    <div class="actions">
      <a href="/">Accueil</a>
      <a href="/#services">Services</a>
    </div>
  </main>
</body>
